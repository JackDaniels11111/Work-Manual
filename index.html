<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#2f5d50;--acs:#e3efe9;--bd:#e5e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#15181c;--card:#1e2328;--tx:#eceae4;--mut:#9aa1ab;--ac:#7fc4a8;--acs:#23332d;--bd:#2c333a}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

h1{font-size:26px;margin:8px 0 4px}h2{font-size:21px;margin:4px 0 8px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 6px;font-family:system-ui,sans-serif}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button,input,textarea{font:inherit;font-family:system-ui,sans-serif}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--acs);color:var(--ac)}.x,.back{background:none;color:var(--mut);padding:4px 8px}.back{color:var(--ac);padding:4px 0}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
textarea{min-height:80px}input[type=checkbox]{width:20px;height:20px;flex:none}
input.clr{width:44px;height:40px;padding:2px;flex:none}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.date{color:var(--mut);font-size:12px;font-family:system-ui,sans-serif}
.num{width:36px;height:36px;border-radius:50%;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:system-ui,sans-serif}.num.done{background:var(--ac);color:var(--bg)}
.ch{display:flex;gap:12px;align-items:center;cursor:pointer}.ch b{display:block}.ch small{color:var(--mut)}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0}.try{background:var(--acs);border-radius:10px;padding:12px;margin:12px 0}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.item span{flex:1}.dn{text-decoration:line-through;color:var(--mut)}
.bar{height:8px;background:var(--acs);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 2px;font-size:11px}nav button.on{color:var(--ac)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.wd{text-align:center;font-size:11px;color:var(--mut);font-family:system-ui,sans-serif}
.cell{min-height:62px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:2px;overflow:hidden;cursor:pointer}
.cell.tdy{border-color:var(--ac)}.cell.sel{outline:2px solid var(--ac)}.cell i{font-size:11px;font-style:normal;color:var(--mut);font-family:system-ui,sans-serif}
.cp{display:block;font-size:9px;line-height:13px;color:#fff;border-radius:3px;padding:0 3px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:system-ui,sans-serif}
.blk{border-left:5px solid;border-radius:8px;padding:8px 10px;margin:8px 0;cursor:pointer}
.pc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-family:system-ui,sans-serif;background:var(--acs);border-radius:12px;padding:2px 8px;margin:2px 3px 2px 0}.pc i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:16px;padding:5px 11px;margin:3px 4px 3px 0;font-size:14px}.chip.on{border-color:var(--ac);background:var(--acs)}.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:system-ui,sans-serif}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 20px}
.sheet{max-width:560px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px}
.tb{position:absolute;border-radius:7px;color:#fff;padding:2px 6px;font:12px/1.25 system-ui,sans-serif;overflow:hidden;touch-action:none;cursor:grab;z-index:2}
.gs{max-height:62vh;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}.grid{position:relative}
.hr{border-top:1px solid var(--bd);position:relative;cursor:pointer}.hr span{position:absolute;left:4px;top:2px;font-size:11px;color:var(--mut);font-family:system-ui,sans-serif}
select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:14px;font-family:system-ui,sans-serif}
.bdg{display:inline-block;color:#fff;border-radius:10px;padding:0 8px;font-size:12px;font-family:system-ui,sans-serif;margin:2px 0}
</style></head><body><main id="app"></main><div id="modal"></div><nav id="nav"></nav>
<script>
const $=i=>document.getElementById(i),P=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate()),uid=()=>"i"+Date.now().toString(36)+Math.floor(Math.random()*999);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CH=[
{t:"Why We Plan",s:"Purpose drives the plan",p:["Planning starts with purpose. Write one sentence on what you are working toward and why.","Plans are how purpose becomes action. Without them, urgent tasks crowd out important ones.","Plan in layers: purpose, then goals, then weekly plans, then daily plans.","Treat your plan as a commitment you can adjust, not a cage."],a:"Write your purpose in one sentence in the Week tab.",go:"week"},
{t:"Setting Goals",s:"Specific, measurable, dated",p:["Set long-term goals first, then break them into goals you can reach in weeks.","A good goal is specific, measurable, written down and has a date.","Set goals you can influence through your own effort, such as actions you take, not outcomes you merely hope for.","Share goals with someone who will hold you accountable."],a:"Add three goals with due dates.",go:"week"},
{t:"Weekly Planning",s:"Plan once, then follow through",p:["Hold a weekly planning session at the same time each week, such as Sunday evening.","Review last week: what did you accomplish, and what got in the way?","Set key indicator targets for the week, such as workouts, contacts made or focused work sessions.","Schedule fixed commitments first, then place your priorities in the open time.","Decide which people you need to see or follow up with this week."],a:"Block out next week’s fixed commitments and priorities on the calendar.",go:"cal"},
{t:"Daily Planning",s:"Start each day with a plan",p:["Spend 15 to 30 minutes each morning planning. Review the week’s plan first.","Choose your top 3 priorities and give each a specific time.","Prepare for each meeting or conversation: purpose, questions and any follow-up.","Leave margin. Plans work better with buffer between commitments.","End the day with a short review of what to carry forward."],a:"Set tomorrow’s top 3 and place them on the calendar.",go:"week"},
{t:"Evaluate and Adjust",s:"Learn from every week",p:["Ask at the end of each day and week: what worked, what didn’t, and what will I change?","Write your reflections in Notes so you can see progress over time.","Celebrate progress. Review goals and adjust the ones that no longer fit.","Then plan again. The cycle of plan, work and evaluate is what builds momentum."],a:"Write this week’s evaluation in Notes.",go:"journal"}];
let S={tab:"cal",cur:"",sel:key(new Date()),ev:[],ppl:[],tasks:[],top:[],goals:[],journal:[],done:{},open:null,cfg:false,
cats:[{id:"c1",n:"Work",c:"#2f6fb5"},{id:"c2",n:"Gym",c:"#d9534f"},{id:"c3",n:"Personal",c:"#8e5bb5"},{id:"c4",n:"Social",c:"#e0a030"},{id:"c5",n:"Errands",c:"#3a9d6b"},{id:"c6",n:"Class",c:"#2aa5a5"}],

try{Object.assign(S,JSON.parse(localStorage.getItem("wm1")||"{}"))}catch(e){}
S.cur=S.cur||key(new Date()).slice(0,7);S.m=null;S.cfg=false;S.pri=S.pri||{};S.cv=S.cv||"month";S.wo=0;S.wd="";S.gd="";S.wt="";S.ps=S.ps||"az";S.pf="";S.tasks.forEach(t=>{if(!t.id)t.id=uid()});
const save=()=>{try{const{m,...r}=S;localStorage.setItem("wm1",JSON.stringify(r))}catch(e){}};
const cc=id=>(S.cats.find(c=>c.id==id)||{c:"#888"}).c,cn=id=>(S.cats.find(c=>c.id==id)||{n:"Other"}).n,gc=id=>(S.grp.find(c=>c.id==id)||{c:"#888"}).c,gn=id=>(S.grp.find(c=>c.id==id)||{n:""}).n;
const pr=id=>S.ppl.find(p=>p.id==id),evs=k=>S.ev.filter(e=>e.d==k).sort((a,b)=>(a.s||"").localeCompare(b.s||""));
const pc=id=>{const p=pr(id);return p?`<span class="pc"><i style="background:${gc(p.g)}"></i>${esc(p.n)}</span>`:""};
const go=t=>{S.tab=t;S.open=null;S.m=null;S.cfg=false;save();draw();scrollTo(0,0)};
function draw(){const T={cal,week,tasks,ppl,journal,guide};if(!T[S.tab])S.tab="cal";const o=$("gs"),st=o?o.scrollTop:7*H;$("app").innerHTML=T[S.tab]();const g=$("gs");if(g)g.scrollTop=st;
$("nav").innerHTML=[["cal","Calendar"],["week","Week"],["tasks","Tasks"],["ppl","People"],["journal","Notes"],["guide","Guide"]].map(n=>`<button class="${S.tab==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");mdraw()}
/* config editor */
const ed=l=>`<div class="card">${S[l].map(x=>`<div class="row"><input type="color" class="clr" value="${x.c}" onchange="up('${l}','${x.id}','c',this.value)"><input value="${esc(x.n)}" onchange="up('${l}','${x.id}','n',this.value)"><button class="x" onclick="rm('${l}','${x.id}')">✕</button></div>`).join("")}<div class="row"><input type="color" class="clr" id="nc_${l}" value="#888888"><input id="nn_${l}" placeholder="Add new"><button onclick="ad('${l}')">Add</button></div></div>`;
const up=(l,id,f,v)=>{S[l].forEach(x=>{if(x.id==id)x[f]=v});save()},rm=(l,id)=>{S[l]=S[l].filter(x=>x.id!=id);save();draw()},ad=l=>{const n=$("nn_"+l).value.trim();if(n){S[l].push({id:uid(),n,c:$("nc_"+l).value});save();draw()}};
/* calendar */
const H=48,dk=k=>new Date(k+"T00:00"),tm=s=>{if(!s)return null;const[a,b]=s.split(":").map(Number);return a*60+b},hm=m=>P(Math.floor(m/60))+":"+P(m%60),fd=k=>dk(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const addD=(k,n)=>{const x=dk(k);x.setDate(x.getDate()+n);return key(x)},wsOf=k=>addD(k,-dk(k).getDay());
const pri=k=>S.pri[k]=S.pri[k]||[{t:"",x:false},{t:"",x:false},{t:"",x:false}];
const items=k=>[...evs(k).map(e=>({t:e.t,c:cc(e.c)})),...(S.pri[k]||[]).filter(p=>p.t).map(p=>({t:"★ "+p.t,c:"#b8901c"})),...S.goals.filter(g=>g.d==k).map(g=>({t:"◎ "+g.t,c:"#b8901c"})),...S.tasks.filter(t=>t.d==k).map(t=>({t:(t.x?"☑ ":"☐ ")+t.t,c:"#6b7280"}))];
const mv=n=>{const[y,m]=S.cur.split("-").map(Number),d=new Date(y,m-1+n,1);S.cur=d.getFullYear()+"-"+P(d.getMonth()+1);draw()},sday=n=>{S.sel=addD(S.sel,n);S.cur=S.sel.slice(0,7);draw()};
const tgT=id=>{const t=S.tasks.find(x=>x.id==id);if(t)t.x=!t.x;save();draw()},tgG=id=>{const g=S.goals.find(x=>x.id==id);if(g)g.x=!g.x;save();draw()},px=(k,i,v)=>{pri(k)[i].x=v;save();draw()};
const cbx=(on,fn,t,x)=>`<div class="item"><input type="checkbox" ${x?"checked":""} onchange="${fn}"><span class="${x?"dn":""}">${t}</span></div>`;
const extras=k=>(S.pri[k]||[]).map((p,i)=>p.t?cbx(0,`px('${k}',${i},this.checked)`,"★ "+esc(p.t),p.x):"").join("")+S.goals.filter(g=>g.d==k).map(g=>cbx(0,`tgG('${g.id}')`,"◎ "+esc(g.t),g.x)).join("")+S.tasks.filter(t=>t.d==k&&(!t.tm||S.cv!="day")).map(t=>cbx(0,`tgT('${t.id}')`,esc(t.t)+(t.tm?` <span class="date">${t.tm}</span>`:""),t.x)).join("");
const blk=e=>`<div class="blk" style="border-color:${cc(e.c)};background:${cc(e.c)}26" onclick="evForm('${e.id}')"><b>${esc(e.t)}</b><div class="date">${e.s?esc(e.s)+(e.e?" – "+esc(e.e):""):"All day"} · ${esc(cn(e.c))}</div>${e.l?`<div class="date">${esc(e.l)}</div>`:""}<div>${(e.p||[]).map(pc).join("")}</div>${e.n?`<div class="date">${esc(e.n)}</div>`:""}</div>`;
const colors=()=>`<h3>Event types &amp; colors</h3>${S.cats.map(c=>`<span class="chip"><i style="background:${c.c}"></i>${esc(c.n)}</span>`).join("")}<div><button class="ghost" onclick="S.cfg=!S.cfg;draw()">${S.cfg?"Done":"Edit / add types"}</button></div>${S.cfg?ed("cats"):""}${remind()}`;
const newEv=o=>{S.m=Object.assign({k:"ev",id:null,t:"",d:S.sel,s:"",e:"",l:"",c:S.cats[0]?S.cats[0].id:"",p:[],n:""},o);mdraw()},newAt=h=>newEv({s:P(h)+":00",e:h<23?P(h+1)+":00":"23:59"});
const view=v=>{S.cv=v;save();draw()};
function cal(){if(S.cv=="day")return dayv();const[y,mo]=S.cur.split("-").map(Number),st=new Date(y,mo-1,1).getDay(),nd=new Date(y,mo,0).getDate(),td=key(new Date());let g="";for(let i=0;i<st;i++)g+="<div></div>";
for(let d=1;d<=nd;d++){const k=y+"-"+P(mo)+"-"+P(d),it=items(k);g+=`<div class="cell${k==S.sel?" sel":""}${k==td?" tdy":""}" onclick="S.sel='${k}';draw()"><i>${d}</i>${it.slice(0,3).map(e=>`<span class="cp" style="background:${e.c}">${esc(e.t)}</span>`).join("")}${it.length>3?`<span class="date">+${it.length-3}</span>`:""}</div>`}
const ex=extras(S.sel),l=evs(S.sel);
return `<div class="row"><button class="ghost" onclick="mv(-1)">←</button><h2 style="flex:1;text-align:center;margin:0">${new Date(y,mo-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button class="ghost" onclick="mv(1)">→</button></div>
<div class="g7" style="margin-top:10px">${"SMTWTFS".split("").map(d=>`<div class="wd">${d}</div>`).join("")}${g}</div>
<div class="row" style="margin-top:14px"><h2 style="flex:1;margin:0">${dk(S.sel).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2><button class="ghost" onclick="view('day')">Day view</button><button onclick="evForm()">+ Event</button></div>${l.map(blk).join("")}${ex}${l.length||ex?"":'<p class="sub">Nothing scheduled.</p>'}${colors()}`}
function dayv(){const k=S.sel,l=evs(k),bl=[...l.filter(e=>e.s).map(e=>{const a=tm(e.s);let b=e.e?tm(e.e):a+60;if(b<=a)b=a+30;return{kd:"e",id:e.id,a,b,c:cc(e.c),l:e.t,s:e.l}}),...S.tasks.filter(t=>t.d==k&&t.tm).map(t=>({kd:"t",id:t.id,a:tm(t.tm),b:tm(t.tm)+30,c:"#6b7280",l:(t.x?"☑ ":"☐ ")+t.t}))].sort((p,q)=>p.a-q.a),cols=[];
bl.forEach(b=>{let i=cols.findIndex(e=>e<=b.a);if(i<0){i=cols.length;cols.push(0)}cols[i]=b.b;b.i=i});const n=Math.max(1,cols.length),ad=l.filter(e=>!e.s).map(blk).join("")+extras(k);let r="";for(let h=0;h<24;h++)r+=`<div class="hr" style="height:${H}px" onclick="newAt(${h})"><span>${h%12||12}${h<12?"a":"p"}</span></div>`;
return `<div class="row"><button class="ghost" onclick="sday(-1)">←</button><h2 style="flex:1;text-align:center;margin:0">${dk(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</h2><button class="ghost" onclick="sday(1)">→</button></div>
<div class="row" style="margin:10px 0"><button class="ghost" onclick="view('month')">Month view</button><button onclick="newEv()">+ Event</button></div>${ad}<p class="date">Tap an hour to add an event. Drag a block up or down to move it. Tap a block to open it.</p>
<div class="gs" id="gs"><div class="grid" style="height:${24*H}px">${r}${bl.map(b=>`<div class="tb" data-k="${b.kd}" data-i="${b.id}" data-a="${b.a}" data-b="${b.b}" onpointerdown="dn(event)" style="top:${b.a/60*H}px;height:${Math.max(22,(b.b-b.a)/60*H-2)}px;left:calc(46px + (100% - 46px)*${b.i/n});width:calc((100% - 46px)/${n} - 3px);background:${b.c}"><b>${esc(b.l)}</b>${b.s?"<br>"+esc(b.s):""}</div>`).join("")}</div></div>${colors()}`}

/* modal */
const rd=()=>["t","d","s","e","l","n"].forEach(f=>{const x=$("f_"+f);if(x)S.m[f]=x.value}),rdp=()=>["n","ph","em","ad","nt"].forEach(f=>{const x=$("p_"+f);if(x)S.m[f]=x.value});
function evForm(id){const e=id&&S.ev.find(x=>x.id==id);S.m=e?{k:"ev",...e,p:[...(e.p||[])]}:{k:"ev",id:null,t:"",d:S.sel,s:"",e:"",l:"",c:S.cats[0]?S.cats[0].id:"",p:[],n:""};mdraw()}
function ppForm(id){const p=id&&pr(id);S.m=p?{k:"pp",...p}:{k:"pp",id:null,n:"",g:S.grp[0]?S.grp[0].id:"",ph:"",em:"",ad:"",nt:""};mdraw()}
const setC=id=>{rd();S.m.c=id;mdraw()},togP=id=>{rd();const p=S.m.p,i=p.indexOf(id);i>-1?p.splice(i,1):p.push(id);mdraw()},setG=id=>{rdp();S.m.g=id;mdraw()},close=()=>{S.m=null;mdraw()};
function svEv(){rd();const{k,...e}=S.m;if(!e.t.trim()){$("f_t").focus();return}e.d=e.d||S.sel;if(e.id)S.ev=S.ev.map(x=>x.id==e.id?e:x);else{e.id=uid();S.ev.push(e)}S.sel=e.d;S.cur=e.d.slice(0,7);S.m=null;save();draw()}
function svPp(){rdp();const{k,...p}=S.m;if(!p.n.trim()){$("p_n").focus();return}if(p.id)S.ppl=S.ppl.map(x=>x.id==p.id?p:x);else{p.id=uid();S.ppl.push(p)}S.m=null;save();draw()}
